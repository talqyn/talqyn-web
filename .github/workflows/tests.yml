name: Tests

# GitHub Flow: main changes only through a pull request, and a pull request
# can merge only when up to date with main — so the run on the pull request
# has already tested what lands, and a second run after the merge would test
# the same tree again.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes the run before it pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The Node the release workflow publishes from.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      # Warnings already fail the typecheck (strict, noUnusedLocals). The build
      # runs too: emitting declarations and bundling the script-tag build can
      # fail where the typecheck passes.
      - name: Tests, typecheck, and the build
        run: npm test && npm run typecheck && npm run build
